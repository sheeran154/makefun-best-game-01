<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOIDSTRIKE — Neon Sector Defense</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05010f; }
  #game {
    position: fixed; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    display: block; touch-action: none; cursor: crosshair;
    background: #05010f;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</atem:head>
<body>
<canvas id="game" width="1280" height="720" aria-label="VOIDSTRIKE: fly with WASD or arrow keys, aim with the mouse, click or press Space to fire"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
